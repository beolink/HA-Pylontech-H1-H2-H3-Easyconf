name: Validate

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # HACS and hassfest change their rules, and Home Assistant its releases,
    # without a commit here, so everything runs again every Monday.
    - cron: "0 4 * * 1"
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  hacs:
    name: HACS validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No check is switched off: HACS's default list wants the action passing
      # with no `ignore` key. The brand check is met by the images the
      # integration ships in custom_components/<domain>/brand/, which Home
      # Assistant reads since 2026.3.
      - uses: hacs/action@main
        with:
          category: integration

  ruff:
    runs-on: ubuntu-latest
    env:
      # Pinned and raised by hand, so the run goes red over a change here,
      # not over a new rule in ruff.
      RUFF_VERSION: "0.16.6"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install "ruff==${RUFF_VERSION}"
      - run: ruff check --output-format=github .

  tests:
    name: tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      # aiohttp for the cloud tests; Home Assistant brings it in a house.
      - run: pip install -r requirements-test.txt aiohttp
      - run: pytest -q

  smoke:
    name: real Home Assistant ${{ matrix.ha }}
    # The unit tests run without Home Assistant, so a moved Home Assistant
    # name, a selector config the real selector refuses or a translation that
    # does not resolve would first show in a house. The floor in hacs.json and
    # a current release.
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ha: ["2026.5.0", "2026.9.4"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: python -m pip install "homeassistant==${{ matrix.ha }}"
      - run: python scripts/smoke_real_ha.py
